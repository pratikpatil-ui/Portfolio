<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#F5F3EF"/>

  <!-- Background decorations -->
  <circle cx="520" cy="100" r="80" fill="#E0EFE9" opacity="0.5"/>
  <circle cx="80" cy="320" r="60" fill="#F2B647" opacity="0.15"/>

  <!-- Main Dashboard Card -->
  <rect x="80" y="50" width="440" height="300" rx="16" fill="white" stroke="#4C8572" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>

  <!-- Header -->
  <rect x="80" y="50" width="440" height="60" rx="16" fill="#4C8572"/>
  <rect x="80" y="94" width="440" height="16" fill="#4C8572"/>
  <text x="110" y="88" fill="white" font-size="18" font-weight="bold" font-family="system-ui">E-Banking Dashboard</text>
  <circle cx="480" cy="80" r="20" fill="white" opacity="0.2"/>
  <text x="473" y="86" fill="white" font-size="14" font-family="system-ui">PP</text>

  <!-- Balance Card -->
  <rect x="100" y="130" width="180" height="90" rx="12" fill="linear-gradient(135deg, #4C8572, #5FCCBA)" stroke="none"/>
  <defs>
    <linearGradient id="balanceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4C8572"/>
      <stop offset="100%" style="stop-color:#5FCCBA"/>
    </linearGradient>
  </defs>
  <rect x="100" y="130" width="180" height="90" rx="12" fill="url(#balanceGrad)"/>
  <text x="115" y="155" fill="white" opacity="0.8" font-size="12" font-family="system-ui">Available Balance</text>
  <text x="115" y="190" fill="white" font-size="28" font-weight="bold" font-family="system-ui">$24,580</text>
  <text x="115" y="210" fill="white" opacity="0.7" font-size="10" font-family="system-ui">+12.5% this month</text>

  <!-- Quick Actions -->
  <rect x="300" y="130" width="200" height="90" rx="12" fill="#E0EFE9"/>
  <text x="315" y="155" fill="#1F2933" font-size="12" font-weight="600" font-family="system-ui">Quick Actions</text>

  <rect x="315" y="170" width="50" height="40" rx="8" fill="white"/>
  <circle cx="340" cy="185" r="10" fill="#4C8572"/>
  <text x="325" y="205" fill="#6B7280" font-size="8" font-family="system-ui">Transfer</text>

  <rect x="375" y="170" width="50" height="40" rx="8" fill="white"/>
  <circle cx="400" cy="185" r="10" fill="#F2B647"/>
  <text x="387" y="205" fill="#6B7280" font-size="8" font-family="system-ui">Pay</text>

  <rect x="435" y="170" width="50" height="40" rx="8" fill="white"/>
  <circle cx="460" cy="185" r="10" fill="#D4A373"/>
  <text x="443" y="205" fill="#6B7280" font-size="8" font-family="system-ui">History</text>

  <!-- Recent Transactions -->
  <text x="100" y="250" fill="#1F2933" font-size="14" font-weight="600" font-family="system-ui">Recent Transactions</text>

  <rect x="100" y="265" width="400" height="35" rx="8" fill="#F9F8F6"/>
  <circle cx="125" cy="282" r="12" fill="#22C55E" opacity="0.2"/>
  <text x="122" y="287" fill="#22C55E" font-size="12" font-family="system-ui">+</text>
  <text x="145" y="287" fill="#1F2933" font-size="12" font-family="system-ui">Salary Credit</text>
  <text x="420" y="287" fill="#22C55E" font-size="12" font-weight="600" font-family="system-ui">+$5,200</text>

  <rect x="100" y="305" width="400" height="35" rx="8" fill="white"/>
  <circle cx="125" cy="322" r="12" fill="#EF4444" opacity="0.2"/>
  <text x="122" y="327" fill="#EF4444" font-size="12" font-family="system-ui">-</text>
  <text x="145" y="327" fill="#1F2933" font-size="12" font-family="system-ui">Amazon Purchase</text>
  <text x="420" y="327" fill="#EF4444" font-size="12" font-weight="600" font-family="system-ui">-$156</text>

  <!-- Floating elements -->
  <circle cx="550" cy="200" r="30" fill="#4C8572" opacity="0.1"/>
  <circle cx="50" cy="180" r="25" fill="#F2B647" opacity="0.1"/>
</svg>
