<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#F5F3EF"/>

  <!-- Background decorations -->
  <circle cx="100" cy="100" r="120" fill="#E0EFE9" opacity="0.4"/>
  <circle cx="500" cy="300" r="100" fill="#F2B647" opacity="0.15"/>

  <!-- Phone Frame -->
  <rect x="200" y="30" width="200" height="340" rx="30" fill="#1F2933" stroke="#374151" stroke-width="2"/>
  <rect x="210" y="45" width="180" height="310" rx="20" fill="white"/>

  <!-- Status Bar -->
  <rect x="210" y="45" width="180" height="25" rx="20" fill="#4C8572"/>
  <rect x="210" y="60" width="180" height="10" fill="#4C8572"/>
  <text x="225" y="62" fill="white" font-size="10" font-family="system-ui">9:41</text>
  <circle cx="370" cy="57" r="3" fill="white"/>
  <rect x="350" y="54" width="15" height="6" rx="2" fill="white"/>

  <!-- App Content -->
  <text x="255" y="95" fill="#1F2933" font-size="18" font-weight="bold" font-family="system-ui">YouID</text>

  <!-- NFC Icon -->
  <circle cx="300" cy="150" r="35" fill="#E0EFE9"/>
  <circle cx="300" cy="150" r="25" fill="#4C8572" opacity="0.3"/>
  <circle cx="300" cy="150" r="15" fill="#4C8572"/>
  <!-- NFC waves -->
  <path d="M275 150 Q275 125, 300 125" stroke="#4C8572" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M265 150 Q265 115, 300 115" stroke="#4C8572" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M325 150 Q325 125, 300 125" stroke="#4C8572" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M335 150 Q335 115, 300 115" stroke="#4C8572" stroke-width="2" fill="none" opacity="0.3"/>

  <text x="260" y="205" fill="#6B7280" font-size="10" font-family="system-ui">Tap to scan NFC tag</text>

  <!-- User Profile Card -->
  <rect x="225" y="225" width="150" height="100" rx="12" fill="#F9F8F6" stroke="#E0EFE9" stroke-width="1"/>
  <circle cx="260" cy="260" r="20" fill="#4C8572"/>
  <text x="253" y="266" fill="white" font-size="14" font-weight="bold" font-family="system-ui">PP</text>
  <text x="290" y="255" fill="#1F2933" font-size="11" font-weight="600" font-family="system-ui">Pratik Patil</text>
  <text x="290" y="270" fill="#6B7280" font-size="9" font-family="system-ui">ID: NFC-7777</text>

  <rect x="235" y="290" width="130" height="25" rx="6" fill="#4C8572"/>
  <text x="262" y="307" fill="white" font-size="10" font-family="system-ui">View Profile</text>

  <!-- Home indicator -->
  <rect x="270" y="345" width="60" height="5" rx="2.5" fill="#1F2933" opacity="0.3"/>

  <!-- Floating NFC Tag -->
  <ellipse cx="480" cy="150" rx="60" ry="40" fill="#D4A373" opacity="0.3"/>
  <ellipse cx="480" cy="150" rx="50" ry="32" fill="#D4A373"/>
  <circle cx="480" cy="150" r="15" fill="white" opacity="0.5"/>
  <circle cx="480" cy="150" r="8" fill="#4C8572"/>

  <!-- Connection line -->
  <path d="M390 150 Q420 150, 420 150 T430 150" stroke="#4C8572" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Cloud icon -->
  <ellipse cx="120" cy="280" rx="40" ry="25" fill="#4C8572" opacity="0.2"/>
  <ellipse cx="130" cy="275" rx="25" ry="18" fill="#4C8572" opacity="0.3"/>
  <ellipse cx="110" cy="280" rx="20" ry="15" fill="#4C8572" opacity="0.3"/>
  <path d="M95 295 L145 295" stroke="#4C8572" stroke-width="2" opacity="0.3"/>
  <path d="M105 305 L135 305" stroke="#4C8572" stroke-width="1.5" opacity="0.2"/>

  <!-- Labels -->
  <text x="450" y="210" fill="#D4A373" font-size="12" font-weight="600" font-family="system-ui">NFC Tag</text>
  <text x="90" cy="330" fill="#4C8572" font-size="12" font-weight="600" font-family="system-ui">Cloud Sync</text>
</svg>
